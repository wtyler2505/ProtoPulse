name: Packages CI

# CI for the greenfield @protopulse/* workspace (vision redesign).
# The legacy app's gates live in ci.yml and are untouched by this file.
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'content/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/packages-ci.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'content/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/packages-ci.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  packages:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck packages
        run: npm run check:packages

      - name: Lint packages
        run: npx eslint packages tools/golden --quiet

      - name: Test all workspaces (graph coverage gate enforced in-package)
        run: npm run test:packages

      - name: Build the CLI bundle
        run: npm run -w @protopulse/cli build

      - name: CLI smoke — check a golden fixture
        run: |
          node packages/cli/dist/protopulse.js check tools/golden/fixtures/traffic-light-555/design.ppx.json --format json
          node packages/cli/dist/protopulse.js check tools/golden/fixtures/probe-input-protection/design.ppx.json --fail-on warn

      - name: Build the editor app
        run: npm run -w @protopulse/app build
